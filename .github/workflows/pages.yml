# Deploys the static site (public/ + public/mirror/index.html) to GitHub Pages.
# Replaces the Next.js sample workflow: this site is a pre-compiled static page, so
# `next build` is not needed for hosting and `next export` cannot express the
# "/" -> "/mirror/index.html" rewrite. scripts/build-static-site.mjs does that instead
# and prefixes asset paths with the Pages base path (e.g. /DeepPrior) when needed.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build:static
        env:
          # "" for <user>.github.io or a custom domain, "/<repo>" for a project site
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
